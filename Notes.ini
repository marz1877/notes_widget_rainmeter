[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
Draggable=1
; --- RIGHT-CLICK MENU ---
ContextTitle=Edit Config...
ContextAction=["#CURRENTPATH#notes-config.ini"]
ContextTitle2=Reload Config
ContextAction2=[!CommandMeasure MeasureLua "LoadConfig()"][!Refresh]
ContextTitle3=----------
ContextAction3=[]
ContextTitle4=Scale Up (+0.05)
ContextAction4=[!CommandMeasure MeasureLua "ScaleStep(0.05)"]
ContextTitle5=Scale Down (-0.05)
ContextAction5=[!CommandMeasure MeasureLua "ScaleStep(-0.05)"]
ContextTitle6=----------
ContextAction6=[]
ContextTitle7=Tiny  (0.50)
ContextAction7=[!CommandMeasure MeasureLua "SetScale(0.50)"]
ContextTitle8=Small (0.75)
ContextAction8=[!CommandMeasure MeasureLua "SetScale(0.75)"]
ContextTitle9=Normal (1.00)
ContextAction9=[!CommandMeasure MeasureLua "SetScale(1.00)"]
ContextTitle10=Large (1.25)
ContextAction10=[!CommandMeasure MeasureLua "SetScale(1.25)"]
ContextTitle11=Huge  (1.50)
ContextAction11=[!CommandMeasure MeasureLua "SetScale(1.50)"]
ContextTitle12=----------
ContextAction12=[]
ContextTitle13=Reset Scale
ContextAction13=[!CommandMeasure MeasureLua "ResetScale()"]

[Metadata]
Name=Notes Viewer
Author=Marz
Information=Shows .txt and .md as notes from folder(s) with arrow navigation and notepad integration.
Version=1.0

[Variables]
; --- CONFIGURATION ---
NotesPath=C:\;D:\Folder;X:\TextFile.txt
Subfolders=1
CurrentFile=""

; --- SCALE CONFIGURATION ---
Scale=0.80

; --- DISPLAY CONFIGURATION ---
BaseWidth=600
BaseHeight=500
BasePadding=20
BaseItemPadding=10

Width=(#BaseWidth# * #Scale#)
Height=(#BaseHeight# * #Scale#)
Padding=(#BasePadding# * #Scale#)
ItemPadding=(#BaseItemPadding# * #Scale#)

; Colors (VisionBoard Inspired)
MainBG=0,0,0,140
ControlBG=0,0,0,180
AccentColor=255,255,255
TextColor=255,255,255,200
DimColor=255,255,255,100

FontBody=Segoe UI
FontTitleSize=(16 * #Scale#)
FontTextSize=(12 * #Scale#)

; --- MEASURES ---

[MeasureLua]
Measure=Script
ScriptFile=Notes.lua
UpdateDivider=1

; Use RunCommand to list files (supports folders and direct files)
[MeasureFileList]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "'#NotesPath#'.Split(';') | ForEach-Object { $p = $_.Trim(); if (-not [string]::IsNullOrWhiteSpace($p)) { if (Test-Path -LiteralPath $p -PathType Leaf) { (Get-Item -LiteralPath $p).FullName } elseif (Test-Path -LiteralPath $p -PathType Container) { Get-ChildItem -LiteralPath $p -Recurse:$([bool]#Subfolders#) -File | Where-Object { $_.Extension -in '.txt','.md' } | Select-Object -ExpandProperty FullName } } } | Select-Object -Unique"
OutputType=ANSI
FinishAction=[!CommandMeasure MeasureLua "ParseFileListFromMeasure()"]
UpdateDivider=-1

; --- STYLES ---

[StyleArrow]
FontFace=#FontBody#
FontSize=(18 * #Scale#)
FontColor=#AccentColor#
SolidColor=#ControlBG#
Padding=(8 * #Scale#),(15 * #Scale#),(8 * #Scale#),(15 * #Scale#)
StringAlign=CenterCenter
AntiAlias=1
DynamicVariables=1
Group=Arrows
Hidden=1
; Guard against accidental double-clicks triggering the text meter underneath
LeftMouseDoubleClickAction=[]
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor "0,0,0,255"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor "#ControlBG#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

; --- METERS ---

; Hover Container (Handles showing/hiding arrows)
[MeterContainer]
Meter=Image
W=#Width#
H=#Height#
SolidColor=0,0,0,1
MouseOverAction=[!ShowMeterGroup Arrows][!Redraw]
MouseLeaveAction=[!HideMeterGroup Arrows][!Redraw]
MouseScrollUpAction=[!CommandMeasure MeasureLua "ScrollNote(-3)"]
MouseScrollDownAction=[!CommandMeasure MeasureLua "ScrollNote(3)"]
DynamicVariables=1

; Background
[MeterBG]
Meter=Shape
Shape=Rectangle 0,0,#Width#,#Height# | Fill Color #MainBG# | StrokeWidth 0
DynamicVariables=1

; --- TOP-LEFT RESIZE HANDLE ---
; Click & Drag from top-left corner:
; MouseDown shows overlay to capture drag anywhere across the skin; MouseUp applies new scale.
[MeterResizeHandle]
Meter=Shape
Shape=Rectangle 0,0,(32 * #Scale#),(32 * #Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
X=0
Y=0
MouseActionCursor=1
MouseActionCursorName=SIZE_NWSE
ToolTipText="Scroll to resize | Drag inward to shrink | Double-click to reset"
ToolTipType=0
LeftMouseDownAction=[!CommandMeasure MeasureLua "StartResize()"][!ShowMeter MeterResizeCaptureZone][!Redraw]
LeftMouseDoubleClickAction=[!CommandMeasure MeasureLua "ResetScale()"]
MouseScrollUpAction=[!CommandMeasure MeasureLua "ScaleStep(0.05)"]
MouseScrollDownAction=[!CommandMeasure MeasureLua "ScaleStep(-0.05)"]
MouseOverAction=[!SetOption MeterResizeIcon Shape "Path ResizeGrip | Stroke Color 255,255,255,220 | StrokeWidth (1.5 * #Scale#) | StrokeLineJoin Round"][!Redraw]
MouseLeaveAction=[!SetOption MeterResizeIcon Shape "Path ResizeGrip | Stroke Color 255,255,255,90 | StrokeWidth (1.5 * #Scale#) | StrokeLineJoin Round"][!Redraw]
DynamicVariables=1

[MeterResizeIcon]
Meter=Shape
Shape=Path ResizeGrip | Stroke Color 255,255,255,90 | StrokeWidth (1.5 * #Scale#) | StrokeLineJoin Round
ResizeGrip=(6 * #Scale#),(14 * #Scale#) | LineTo (6 * #Scale#),(6 * #Scale#) | LineTo (14 * #Scale#),(6 * #Scale#)
X=0
Y=0
DynamicVariables=1

; Title / Filename (Centered at top)
[MeterTitle]
Meter=String
X=(#Width# / 2)
Y=(#Padding# + (5 * #Scale#))
W=(#Width# - #Padding# * 4)
FontFace=#FontBody#
FontSize=#FontTitleSize#
FontColor=#AccentColor#
StringAlign=CenterTop
StringStyle=Bold
Text="Loading..."
AntiAlias=1
ClipString=1
FontEffectColor=0,0,0,100
StringEffect=Shadow
ToolTipText=#CurrentFile#
DynamicVariables=1

; Dropdown Arrow (Next to header)
[MeterDropdownArrow]
Meter=Shape
X=(#Width# - #Padding# - (14 * #Scale#))
Y=(#Padding# + (11 * #Scale#))
Shape=Path ChevronDown | Stroke Color #DimColor# | StrokeWidth (1.8 * #Scale#) | StrokeLineJoin Round | StrokeLineCap Round
Shape2=Rectangle (-6 * #Scale#),(-6 * #Scale#),(22 * #Scale#),(22 * #Scale#),2 | Fill Color 0,0,0,1 | StrokeWidth 0
ChevronDown=0,0 | LineTo (5 * #Scale#),(5 * #Scale#) | LineTo (10 * #Scale#),0
ChevronUp=0,(5 * #Scale#) | LineTo (5 * #Scale#),0 | LineTo (10 * #Scale#),(5 * #Scale#)
ToolTipText="Select note..."
LeftMouseUpAction=[!CommandMeasure MeasureLua "ToggleDropdown()"]
MouseOverAction=[!SetOption MeterDropdownArrow Shape "Path ChevronDown | Stroke Color #AccentColor# | StrokeWidth (1.8 * #Scale#) | StrokeLineJoin Round | StrokeLineCap Round"][!SetOption MeterDropdownArrow Shape2 "Rectangle (-6 * #Scale#),(-6 * #Scale#),(22 * #Scale#),(22 * #Scale#),2 | Fill Color 255,255,255,20 | StrokeWidth 0"][!UpdateMeter MeterDropdownArrow][!Redraw]
MouseLeaveAction=[!SetOption MeterDropdownArrow Shape "Path ChevronDown | Stroke Color #DimColor# | StrokeWidth (1.8 * #Scale#) | StrokeLineJoin Round | StrokeLineCap Round"][!SetOption MeterDropdownArrow Shape2 "Rectangle (-6 * #Scale#),(-6 * #Scale#),(22 * #Scale#),(22 * #Scale#),2 | Fill Color 0,0,0,1 | StrokeWidth 0"][!UpdateMeter MeterDropdownArrow][!Redraw]
DynamicVariables=1

; Divider
[MeterDivider]
Meter=Shape
Shape=Rectangle #Padding#,(#Padding# + (40 * #Scale#)),(#Width# - #Padding# * 2),(1 * #Scale#) | Fill Color 255,255,255,40 | StrokeWidth 0
DynamicVariables=1

; Note Content
[MeterNoteText]
Meter=String
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (60 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(#Height# - #Padding# * 2 - (80 * #Scale#))
SolidColor=0,0,0,1
FontFace=#FontBody#
FontSize=#FontTextSize#
FontColor=#TextColor#
Text="Reading files..."
WordWrap=1
AntiAlias=1
ClipString=1
LeftMouseDoubleClickAction=[!CommandMeasure MeasureLua "OpenInNotepad()"]
ToolTipText=""
MouseOverAction=[!CommandMeasure MeasureLua "StartNoteHover()"][!Delay 5000][!CommandMeasure MeasureLua "CheckNoteHover()"]
MouseLeaveAction=[!CommandMeasure MeasureLua "CancelNoteHover()"]
MouseScrollUpAction=[!CommandMeasure MeasureLua "ScrollNote(-3)"]
MouseScrollDownAction=[!CommandMeasure MeasureLua "ScrollNote(3)"]
DynamicVariables=1

; Navigation - Previous (Now defined after NoteText to be on TOP layer)
[MeterPrev]
Meter=String
MeterStyle=StyleArrow
X=(#Padding# + (15 * #Scale#))
Y=(#Height# / 2)
Text=<
LeftMouseUpAction=[!CommandMeasure MeasureLua "Previous()"]
DynamicVariables=1

; Navigation - Next (Now defined after NoteText to be on TOP layer)
[MeterNext]
Meter=String
MeterStyle=StyleArrow
X=(#Width# - #Padding# - (15 * #Scale#))
Y=(#Height# / 2)
Text=>
LeftMouseUpAction=[!CommandMeasure MeasureLua "Next()"]
DynamicVariables=1


; --- DROPDOWN MENU ---

[StyleDropdownItem]
FontFace=Segoe UI
FontSize=(11 * #Scale#)
FontColor=#TextColor#
AntiAlias=1
ClipString=1
SolidColor=0,0,0,1
Padding=(10 * #Scale#),(4 * #Scale#),(10 * #Scale#),(4 * #Scale#)
Group=DropdownGroup
Hidden=1
DynamicVariables=1
MouseScrollUpAction=[!CommandMeasure MeasureLua "ScrollDropdown(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureLua "ScrollDropdown(1)"]

[MeterDropdownOverlay]
Meter=Image
W=#Width#
H=#Height#
SolidColor=0,0,0,1
Group=DropdownGroup
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureLua "CloseDropdown()"]
DynamicVariables=1

[MeterDropdownBG]
Meter=Shape
Shape=Rectangle (#Padding# + (5 * #Scale#)),(#Padding# + (42 * #Scale#)),(#Width# - (#Padding# + (5 * #Scale#)) * 2),(300 * #Scale#),(4 * #Scale#) | Fill Color 18,18,22,250 | Stroke Color 255,255,255,40 | StrokeWidth 1
Group=DropdownGroup
Hidden=1
DynamicVariables=1
MouseScrollUpAction=[!CommandMeasure MeasureLua "ScrollDropdown(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureLua "ScrollDropdown(1)"]

[MeterDropDownItem1]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (0 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(1)"]
MouseOverAction=[!SetOption MeterDropDownItem1 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem1][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem1 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem1][!Redraw]

[MeterDropDownItem2]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (1 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(2)"]
MouseOverAction=[!SetOption MeterDropDownItem2 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem2][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem2 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem2][!Redraw]

[MeterDropDownItem3]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (2 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(3)"]
MouseOverAction=[!SetOption MeterDropDownItem3 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem3][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem3 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem3][!Redraw]

[MeterDropDownItem4]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (3 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(4)"]
MouseOverAction=[!SetOption MeterDropDownItem4 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem4][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem4 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem4][!Redraw]

[MeterDropDownItem5]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (4 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(5)"]
MouseOverAction=[!SetOption MeterDropDownItem5 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem5][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem5 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem5][!Redraw]

[MeterDropDownItem6]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (5 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(6)"]
MouseOverAction=[!SetOption MeterDropDownItem6 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem6][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem6 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem6][!Redraw]

[MeterDropDownItem7]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (6 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(7)"]
MouseOverAction=[!SetOption MeterDropDownItem7 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem7][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem7 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem7][!Redraw]

[MeterDropDownItem8]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (7 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(8)"]
MouseOverAction=[!SetOption MeterDropDownItem8 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem8][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem8 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem8][!Redraw]

[MeterDropDownItem9]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (8 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
H=(24 * #Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureLua "SelectDropdownItem(9)"]
MouseOverAction=[!SetOption MeterDropDownItem9 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem9][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem9 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem9][!Redraw]

[MeterDropDownItem10]
Meter=String
MeterStyle=StyleDropdownItem
X=(#Padding# + (10 * #Scale#))
Y=(#Padding# + (48 * #Scale#) + (9 * 25 * #Scale#))
W=(#Width# - (#Padding# + (10 * #Scale#)) * 2)
