MouseOverAction=[!SetOption MeterDropDownItem10 SolidColor "255,255,255,25"][!UpdateMeter MeterDropDownItem10][!Redraw]
MouseLeaveAction=[!SetOption MeterDropDownItem10 SolidColor "0,0,0,1"][!UpdateMeter MeterDropDownItem10][!Redraw]

; --- RESIZE CAPTURE ZONE ---
; MUST be last meter in file so it is topmost in Z-order and captures mouse-up
; during a resize drag before any other meters can steal the event.
[MeterResizeCaptureZone]
Meter=Shape
Shape=Rectangle 0,0,#Width#,#Height# | Fill Color 0,0,0,1 | StrokeWidth 0
X=0
Y=0
Hidden=1
LeftMouseUpAction=[!CommandMeasure MeasureLua "EndResize($MouseX$, $MouseY$)"][!HideMeter MeterResizeCaptureZone][!Redraw]
DynamicVariables=1
