; =====================================================
; Notes - Configuration
; =====================================================
; Configure folders and direct file locations to include.
;
; HOW TO USE:
;   1. Add folder paths under [FOLDERS] (scanned for .txt and .md files)
;   2. Add direct file paths under [FILES] (specific files to show)
;   3. Right-click the widget -> "Reload Config"
;
; NOTES:
;   - Subfolders=1 includes .txt and .md files in sub-folders of specified folders
;   - Subfolders=0 only searches top-level of specified folders
;   - Direct file paths can point to any specific .txt, .md, or text file
;   - Leave unused slots blank
; =====================================================

; --- SETTINGS --- ; 0 = root only
Subfolders=1

; --- FOLDERS (scanned for text files) ---
